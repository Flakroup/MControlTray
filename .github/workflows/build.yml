name: build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build (Release)
        run: dotnet build MControlTray.csproj -c Release

      - name: Test
        run: dotnet test test/MControlTray.Tests/MControlTray.Tests.csproj -c Release
