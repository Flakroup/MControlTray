name: release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Publish (NativeAOT, single native exe)
        shell: pwsh
        run: dotnet publish MControlTray.csproj -c Release -r win-x64 -o publish

      - name: Name the artifact
        shell: pwsh
        run: Copy-Item publish/MControlTray.exe MControlTray-win-x64.exe

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: MControlTray-win-x64.exe
          generate_release_notes: true
